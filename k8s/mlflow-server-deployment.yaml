apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-server
  labels:
    app: mlflow-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-server
  template:
    metadata:
      labels:
        app: mlflow-server
    spec:
      containers:
        - name: mlflow-server
          image: mlops-mlflow-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: MLFLOW_SERVER_ALLOWED_HOSTS
              value: "mlflow-server:5000,localhost:5000"
          volumeMounts:
            - name: db
              mountPath: /app/db
            - name: artifacts
              mountPath: /app/mlruns
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: "200m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: mlflow-db
        - name: artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-server
spec:
  selector:
    app: mlflow-server
  ports:
    - port: 5000
      targetPort: 5000