services:
  mlflow-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mlflow-server
    volumes:
      - ../mlruns:/app/mlruns
      - ../mlflow.db:/app/mlflow.db
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_SERVER_ALLOWED_HOSTS=mlflow-server:5000,localhost:5000

  train:
    build:
      context: ..
      dockerfile: docker/Dockerfile.train
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
    volumes:
      - ../data:/app/data
    depends_on:
      - mlflow-server

  serve:
    build:
      context: ..
      dockerfile: docker/Dockerfile.serve
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
    ports:
      - "8000:8000"
    depends_on:
      - mlflow-server