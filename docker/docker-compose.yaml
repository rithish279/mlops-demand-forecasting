services:
  mlflow-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mlflow-server
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - mlflow-db:/app/db
      - mlflow-artifacts:/app/mlruns
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_SERVER_ALLOWED_HOSTS=mlflow-server:5000,localhost:5000

  train:
    build:
      context: ..
      dockerfile: docker/Dockerfile.train
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
    volumes:
      - ../data:/app/data
      - mlflow-artifacts:/app/mlruns
    depends_on:
      mlflow-server:
        condition: service_healthy

  serve:
    build:
      context: ..
      dockerfile: docker/Dockerfile.serve
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
    volumes:
      - mlflow-artifacts:/app/mlruns
    ports:
      - "8000:8000"
    depends_on:
      mlflow-server:
        condition: service_healthy

volumes:
  mlflow-db:
  mlflow-artifacts: